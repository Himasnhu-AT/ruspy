[package]
name = "ruspy"
version = "0.1.0"
description = "Rust like efficiency with python like syntax"
edition = "2021"
authors = ["Himanshu <github: Himasnhu-at, email: hyattherate2005@gmail.com"]
readme = "https://github.com/Himasnhu-at/ruspy.git/#readme"
homepage = "https://github.com/Himasnhu-at/ruspy.git/#readme"
repository = "https://github.com/Himasnhu-at/ruspy.git"
license = "BSD-Clause-3"

[lib]
name = "ruspy"
path = "src/lib.rs"

[features]
# Native codegen via Cranelift. Off by default so the core build stays fast;
# turn on with `--features jit`. This is the M14/M15 native backend.
jit = ["dep:cranelift", "dep:cranelift-module", "dep:cranelift-jit", "dep:cranelift-object", "dep:cranelift-native", "dep:target-lexicon"]

[dependencies]
dotenv = "0.15.0"
env_logger = "0.11.5"
log = "0.4.22"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

# --- native backend (optional; behind the `jit` feature) ---
cranelift = { version = "0.134", optional = true }
cranelift-module = { version = "0.134", optional = true }
cranelift-jit = { version = "0.134", optional = true }
cranelift-object = { version = "0.134", optional = true }
target-lexicon = { version = "0.13", optional = true }
cranelift-native = { version = "0.134", optional = true }

# Release profile is inherited from the workspace root (a member's own
# [profile.*] is ignored). ruspy-compiled artifacts get their own hardened
# profile at codegen time, not here.

[[bin]]
name = "ruspy"
path = "src/main.rs"